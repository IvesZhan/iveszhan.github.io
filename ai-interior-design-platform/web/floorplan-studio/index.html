<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="金地大成乐府四房奶油风设计预览，含客餐厅效果图和可编辑的 2D / 3D 户型。">
    <title>大成乐府 · 奶油风｜交换空间</title>
    <link rel="stylesheet" href="./studio.css">
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="../" aria-label="返回交换空间案例库">
        <img src="../assets/brand/xspace-icon.svg" alt="" width="28" height="28">
        <span>交换空间</span>
      </a>
      <a href="../">案例库 <span aria-hidden="true">↗</span></a>
    </header>
    <main>
      <div class="project-intro">
        <div>
          <p class="project-location">金地大成乐府 · 119㎡户型</p>
          <h1>奶油风方案</h1>
        </div>
        <nav class="project-actions" aria-label="打开设计工作台">
          <a class="action action--secondary" href="./editor/">查看 2D 布局</a>
          <a class="action action--primary" href="./editor/?view=3d">打开 3D 工作台 <span aria-hidden="true">↗</span></a>
        </nav>
      </div>

      <div class="project-board">
        <figure class="visual">
          <a class="visual-link" href="./living-dining-cream.webp" aria-label="查看客餐厅效果图原图">
            <img src="./living-dining-cream.webp" alt="沿金地大成乐府客餐厅轴线看向厨房，奶白沙发、浅木餐椅与洞石长桌组成的奶油风设计意向" width="1536" height="1024" fetchpriority="high">
          </a>
          <figcaption>
            <strong>客厅朝餐厨</strong>
            <span>AI 效果意向</span>
          </figcaption>
        </figure>

        <aside class="project-notes" aria-labelledby="plan-title">
          <h2 id="plan-title">户型与布置</h2>
          <p class="plan-summary">四房两厅两卫 · 长桌六席</p>
          <a class="plan-link" href="./floor-plan.webp" aria-label="查看原始户型布置图">
            <img src="./floor-plan.webp" alt="金地大成乐府四房装修布置图，右侧为客餐厨及玄关" width="1365" height="1294">
          </a>
          <dl class="palette">
            <div><dt><span class="swatch swatch--plaster" aria-hidden="true"></span>墙面</dt><dd>暖白矿物涂料</dd></div>
            <div><dt><span class="swatch swatch--oak" aria-hidden="true"></span>柜体</dt><dd>浅橡木 · 米白门板</dd></div>
            <div><dt><span class="swatch swatch--fabric" aria-hidden="true"></span>软装</dt><dd>燕麦织物 · 奶白软包</dd></div>
          </dl>
          <a class="room-link" href="./editor/?view=walk&amp;room=living">从客厅开始漫游 <span aria-hidden="true">↗</span></a>
          <p class="model-note">模型按装修布置图描绘，尺寸为方案估算。</p>
        </aside>
      </div>
    </main>
  </body>
</html>
